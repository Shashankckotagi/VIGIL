name: VIGIL CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. TEST & VERIFICATION HARNESS (CI)
  # =========================================================================
  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Suite
        run: |
          pytest -v tests/

      - name: Run Formal Verification Acceptance Harness (O1, O2, O3)
        run: |
          python verify.py --quick

  # =========================================================================
  # 2. BENCHMARK & ARTIFACT GENERATION
  # =========================================================================
  benchmark:
    name: Run Benchmark & Generate Reports
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Benchmark Suite
        run: |
          python benchmark.py --input sample/demo_clip.avi --provider mock --out report/

      - name: Generate IEEE Figures
        run: |
          python generate_figures.py

      - name: Upload Benchmark & Figure Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vigil-benchmark-and-figures
          path: |
            report/
            figures/
            README_FINAL.md

  # =========================================================================
  # 3. CONTAINER BUILD & PUBLISH TO GHCR (CD)
  # =========================================================================
  build-and-publish-container:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: [test, benchmark]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
